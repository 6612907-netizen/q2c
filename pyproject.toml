[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q2c"
version = "0.1.0"
description = "Reliable handoff infrastructure for AI coding agents — q2c guarantees the handoff, not the outcome."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["agent", "handoff", "bridge", "codex", "qoder", "transport"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
q2c = "q2c.cli:main"

[tool.setuptools]
packages = ["q2c", "q2c.adapters"]

[project.urls]
Protocol = "PROTOCOL.md"
